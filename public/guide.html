.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;rio-stay-map&quot;&gt;
  &lt;h2&gt;Rio lodging and itinerary map&lt;/h2&gt;
  &lt;p class=&quot;rio-trip-dates&quot;&gt;&lt;strong&gt;Trip:&lt;/strong&gt; Thursday, September 24 to Tuesday, September 29, 2026 · 5 nights&lt;/p&gt;
  &lt;p&gt;&lt;a class=&quot;btn&quot; href=&quot;rio-easy-fun-itinerary.html&quot;&gt;Open the relaxed, easy + fun itinerary&lt;/a&gt;&lt;/p&gt;
  &lt;div class=&quot;rio-game-alert&quot; role=&quot;note&quot;&gt;&lt;strong&gt;MAIN EVENT - MARACANÃ&lt;/strong&gt;&lt;span&gt;Baltimore Ravens vs. Dallas Cowboys · Sunday, September 27, 2026 · 5:25 PM Rio time&lt;/span&gt;&lt;/div&gt;
  &lt;section class=&quot;rio-culture-card&quot; aria-labelledby=&quot;rio-culture-title&quot;&gt;
    &lt;h2 id=&quot;rio-culture-title&quot;&gt;Rio culture — enjoy it without the culture shock&lt;/h2&gt;
    &lt;p&gt;&lt;strong&gt;Carioca culture&lt;/strong&gt; is a vibrant blend of African, European and Indigenous influences, shaped by the meeting of mountains, city and sea. Rio often feels informal, expressive and outdoor-centered: music, football, beaches, food and community life are not separate attractions; they are how the city socializes.&lt;/p&gt;
    &lt;div class=&quot;rio-culture-grid&quot;&gt;
      &lt;article&gt;&lt;h3&gt;Music + celebration&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Samba&lt;/strong&gt; grew through Afro-Brazilian communities and became a defining urban rhythm. &lt;strong&gt;Bossa nova&lt;/strong&gt; emerged around Copacabana and Ipanema in the late 1950s. &lt;strong&gt;Funk carioca&lt;/strong&gt; is a high-energy contemporary sound rooted in favela communities. Carnival samba schools prepare year-round; neighborhood &lt;em&gt;blocos&lt;/em&gt; turn streets into communal celebrations.&lt;/p&gt;&lt;/article&gt;
      &lt;article&gt;&lt;h3&gt;Beach + football&lt;/h3&gt;&lt;p&gt;The beach is Rio’s living room. Lifeguard posts, or &lt;em&gt;postos&lt;/em&gt;, help identify different stretches and social scenes. Expect football, footvolley, vendors, coconut water and long conversations. Maracanã is both a stadium and a cultural monument; on match day, leave extra time and expect loud, emotional crowds.&lt;/p&gt;&lt;/article&gt;
      &lt;article&gt;&lt;h3&gt;Food + social rhythm&lt;/h3&gt;&lt;p&gt;Try Saturday &lt;em&gt;feijoada&lt;/em&gt;, neighborhood &lt;em&gt;botecos&lt;/em&gt;, &lt;em&gt;coxinha&lt;/em&gt;, codfish fritters, cold &lt;em&gt;chopp&lt;/em&gt; and a carefully paced caipirinha. Meals may feel more relaxed than in the U.S. Greet people before making a request; a few words of Portuguese—&lt;em&gt;bom dia&lt;/em&gt;, &lt;em&gt;por favor&lt;/em&gt;, &lt;em&gt;obrigado/obrigada&lt;/em&gt;—go a long way.&lt;/p&gt;&lt;/article&gt;
      &lt;article&gt;&lt;h3&gt;What is a favela?&lt;/h3&gt;&lt;p&gt;A favela is a real residential community, not a tourist set and not a synonym for crime. Brazil’s statistics agency describes favelas and urban communities as popular territories built through collective responses to unmet housing needs, often with strong neighborhood identity, commerce and culture alongside uneven infrastructure and public services. Visit only with a reputable, preferably resident-led guide; ask before photographing people or homes, support local businesses and never wander in simply because a map route looks short.&lt;/p&gt;&lt;/article&gt;
    &lt;/div&gt;
    &lt;div class=&quot;rio-first-day&quot;&gt;&lt;strong&gt;First-day reset:&lt;/strong&gt; keep Thursday intentionally light; use the pre-booked driver, settle in, eat at the house, hydrate and take only a short accompanied neighborhood or beach walk. Carry little jewelry, keep phones discreet near curbs and in crowds, use official or pre-arranged transport at night, and build in quiet breaks for anyone who becomes overstimulated.&lt;/div&gt;
    &lt;div class=&quot;rio-phone-safety&quot;&gt;&lt;strong&gt;Keep the phone, data and trip safe:&lt;/strong&gt;&lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;Before departure:&lt;/strong&gt; turn on Find My/Find My Device, automatic backup, a strong passcode and theft-protection features; save the IMEI, carrier and bank numbers somewhere the group can reach without that phone. Carry a small backup phone if practical.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;On the street:&lt;/strong&gt; keep the main phone zipped in a cross-body bag worn in front or in a front pocket. Step inside a hotel, shop, restaurant or the chauffeur’s vehicle before checking maps or messages. Do not use it beside the curb, at an open car window or while entering/leaving a ride.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;At beaches and crowds:&lt;/strong&gt; take minimal valuables; use a waterproof pouch worn on the body and never leave a phone under a towel. One person watches belongings. At Maracanã, pre-write the gate, seat and driver meeting point so the phone stays away.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;If it is taken:&lt;/strong&gt; do not chase or resist. Move to a secure place, use another device to lock/erase it, block the SIM/eSIM and IMEI with the carrier, contact banks through official channels, change critical passwords and file a police report. Call &lt;strong&gt;190&lt;/strong&gt; in an immediate emergency.&lt;/li&gt;
    &lt;/ul&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;Brazil’s Celular Seguro service can help eligible users alert participating carriers and banks; foreign visitors should verify account/line eligibility before relying on it.&lt;/p&gt;&lt;/div&gt;
  &lt;/section&gt;
  &lt;section class=&quot;rio-flight-plan&quot; aria-labelledby=&quot;rio-flight-title&quot;&gt;
    &lt;h2 id=&quot;rio-flight-title&quot;&gt;Flights to A = GIG airport&lt;/h2&gt;
    &lt;p&gt;&lt;strong&gt;Yes, a flight is required before the A-to-1–10 ground transfer.&lt;/strong&gt; The recommended plan has all three travelers meet at Miami International Airport on Wednesday, September 23, then take one shared overnight nonstop to Rio.&lt;/p&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Traveler&lt;/th&gt;&lt;th&gt;Positioning to Miami&lt;/th&gt;&lt;th&gt;Miami wait / instruction&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;1 · Cleveland&lt;/td&gt;&lt;td&gt;AA2887 · CLE 6:19 AM → MIA 9:15 AM&lt;/td&gt;&lt;td&gt;Meet the group at MIA Terminal D check-in at 8:00 PM; remain at MIA for the shared flight.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;2 · Punta Cana&lt;/td&gt;&lt;td&gt;AA2419 · PUJ 1:44 PM → MIA 4:18 PM&lt;/td&gt;&lt;td&gt;AA2638 does not operate Wednesday. Clear U.S. immigration, then meet the group at Terminal D by 8:00 PM.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;3 · Fort Lauderdale&lt;/td&gt;&lt;td&gt;Drive from the FLL area to MIA; normally 45–90 min&lt;/td&gt;&lt;td&gt;Leave about 6:30–7:00 PM and target MIA by 8:00 PM.&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;rio-shared-flight&quot;&gt;&lt;strong&gt;ALL 3 · AA905 · MIA → GIG nonstop&lt;/strong&gt;&lt;span&gt;Depart Wed Sep 23 at 11:00 PM · Arrive Thu Sep 24 at 8:20 AM · Meet at MIA Terminal D at 8:00 PM, check in and board together · Lie-flat Business pods requested · no Miami hotel&lt;/span&gt;&lt;/div&gt;
    &lt;p&gt;&lt;strong&gt;After landing:&lt;/strong&gt; clear immigration and baggage, meet the pre-booked driver, then travel by road from A/GIG to the selected stay. The map and tables below show that transfer for every option 1–10.&lt;/p&gt;
    &lt;h3&gt;Return together, then split&lt;/h3&gt;
    &lt;div class=&quot;rio-shared-flight&quot;&gt;&lt;strong&gt;ALL 3 · AA904 · GIG → MIA nonstop&lt;/strong&gt;&lt;span&gt;Depart Tue Sep 29 at 10:10 PM · Arrive Wed Sep 30 at 5:45 AM · clear immigration and collect bags together before splitting up · do not book onward flights before 10:00 AM&lt;/span&gt;&lt;/div&gt;
    &lt;p&gt;&lt;strong&gt;Everyone leaves Rio together.&lt;/strong&gt; Clear immigration and baggage as a group at MIA; the group trip ends only at public arrivals. Then split:&lt;/p&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm&quot;&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Traveler 1&lt;/td&gt;&lt;td&gt;AA363 · MIA 8:46 PM → Cleveland 11:46 PM.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Traveler 2&lt;/td&gt;&lt;td&gt;AA2649 · MIA 7:46 PM → Detroit; reconfirm the live arrival time before purchase.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Traveler 3&lt;/td&gt;&lt;td&gt;Pre-booked car from MIA to Fort Lauderdale; about 27 miles and typically 35–60 min after airport exit.&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;p class=&quot;text-small text-muted&quot;&gt;&lt;strong&gt;Flight-pricing warning:&lt;/strong&gt; the attached flight map says the exact AA905/AA904 nonstop pod fare was not displayed as bookable. Its $3,197 Miami–Rio round-trip figure is only a comparison floor using a connection and/or mixed cabins—not the requested nonstop pod itinerary. Reconfirm schedules, aircraft, lie-flat seats and the complete fare before purchase.&lt;/p&gt;
  &lt;/section&gt;
  &lt;section class=&quot;rio-budget&quot; aria-labelledby=&quot;rio-budget-title&quot;&gt;
    &lt;h2 id=&quot;rio-budget-title&quot;&gt;TRAVEL COST PER PERSON — HOUSING EXCLUDED&lt;/h2&gt;
    &lt;p&gt;&lt;strong&gt;Travel means airfare plus ground transportation only.&lt;/strong&gt; It does not include Airbnb, activities, food, tickets or optional support services. A single “accurate” total cannot be published until the three live airline carts and the driver’s written quote are selected; the previous comparison-fare totals have been removed.&lt;/p&gt;
    &lt;div class=&quot;rio-budget-callout&quot;&gt;&lt;strong&gt;Use this exact formula after booking:&lt;/strong&gt; each traveler’s live airfare + their positioning / onward ticket + one-third of the signed Rio driver quote. Do not treat a comparison fare, a reseller listing or a generic chauffeur allowance as a final price.&lt;/div&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm rio-budget-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Traveler&lt;/th&gt;&lt;th&gt;Live airfare to enter&lt;/th&gt;&lt;th&gt;Positioning / home leg to enter&lt;/th&gt;&lt;th&gt;Rio driver share&lt;/th&gt;&lt;th&gt;Accurate travel-only total&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;1 · Cleveland&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;AA itinerary at checkout&lt;/td&gt;&lt;td&gt;CLE → MIA and MIA → CLE live tickets&lt;/td&gt;&lt;td&gt;Final signed vehicle quote ÷ 3&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Calculate after quotes are chosen&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;2 · Punta Cana / Detroit&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;AA itinerary at checkout&lt;/td&gt;&lt;td&gt;PUJ → MIA and MIA → DTW live tickets&lt;/td&gt;&lt;td&gt;Final signed vehicle quote ÷ 3&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Calculate after quotes are chosen&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;3 · Fort Lauderdale&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;AA itinerary at checkout&lt;/td&gt;&lt;td&gt;FLL-area → MIA driving / parking + MIA → FLL return car&lt;/td&gt;&lt;td&gt;Final signed vehicle quote ÷ 3&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Calculate after quotes are chosen&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;p class=&quot;text-small text-muted&quot;&gt;The selected transport company should provide one all-in written quote covering meet-and-greet, vehicle class, driver language, daily standby hours, tolls, parking, Maracanã event work, overtime, gratuity policy and cancellation terms. Only then split the group quote by three.&lt;/p&gt;
    &lt;h3&gt;Other non-housing costs — planning references, not a total&lt;/h3&gt;
    &lt;p&gt;The activity figures below are planning references. Confirm availability and total in the linked booking flow; they must not be added to a travel-only figure unless the group chooses them.&lt;/p&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Non-housing category&lt;/th&gt;&lt;th&gt;Per person&lt;/th&gt;&lt;th&gt;What is included&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Travel-only total&lt;/td&gt;&lt;td&gt;Quote-dependent&lt;/td&gt;&lt;td&gt;Live airline carts + each person’s domestic leg + one-third signed driver quote.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Friday landmark tour&lt;/td&gt;&lt;td&gt;$175&lt;/td&gt;&lt;td&gt;Christ train, Sugarloaf, Selarón, sightseeing, transport and BBQ lunch.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Salgueiro rehearsal&lt;/td&gt;&lt;td&gt;$78&lt;/td&gt;&lt;td&gt;Admission, shared table and transfer package; food/drinks extra.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Tijuca + bike + Little Africa guide&lt;/td&gt;&lt;td&gt;$100&lt;/td&gt;&lt;td&gt;R$229 forest tour, R$32.90 bike plan and $50 guide share.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Bar do Mineiro + beach snacks&lt;/td&gt;&lt;td&gt;$20–$43&lt;/td&gt;&lt;td&gt;R$61–120 meal plus R$40–100 in beach snacks.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Other meals + drinks&lt;/td&gt;&lt;td&gt;$194–$388&lt;/td&gt;&lt;td&gt;R$1,000–2,000 trip allowance; Friday BBQ is already included.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;game-row&quot;&gt;&lt;td&gt;&lt;strong&gt;NFL at Maracanã — value ticket&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;$83 + fees&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Based on R$427.50. Premium ticket instead: about $291; hospitality/high tier: about $970, each before fees.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Activities + food&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Select individually&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;No bundled subtotal is shown because ticket tier, dates and chosen services change the result.&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;p&gt;&lt;strong&gt;NFL tickets / hospitality:&lt;/strong&gt; use the official Ticketmaster or On Location live checkout price. Housing remains excluded. Chef, photographer, concierge, stocking, insurance, baggage fees and any armored-vehicle or close-protection service remain separate, quoted purchases.&lt;/p&gt;
  &lt;/section&gt;
  &lt;div class=&quot;viz-controls&quot;&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;rio-stay-select&quot;&gt;Compare a place to stay
      &lt;select class=&quot;form-select&quot; id=&quot;rio-stay-select&quot;&gt;&lt;/select&gt;
    &lt;/label&gt;
  &lt;/div&gt;

    &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm rio-itinerary&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Day&lt;/th&gt;&lt;th&gt;Main plan&lt;/th&gt;&lt;th&gt;Easy pacing / private option&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Thu Sep 24&lt;/td&gt;&lt;td&gt;Arrive at GIG and settle into the villa or penthouse.&lt;/td&gt;&lt;td&gt;Airport meet-and-greet, chauffeured transfer, private chef dinner.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Fri Sep 25&lt;/td&gt;&lt;td&gt;Early Corcovado train and Christ the Redeemer; Sugarloaf at sunset.&lt;/td&gt;&lt;td&gt;Choose the featured Airbnb Experience below for an all-in-one guided day, or keep the private-guide plan for more flexibility.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Sat Sep 26&lt;/td&gt;&lt;td&gt;Cycle Copacabana to Ipanema/Leblon; beach break; samba class and organized live-samba venue.&lt;/td&gt;&lt;td&gt;Keep the afternoon unstructured; private samba instructor and reserved table.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;game-day&quot;&gt;&lt;td&gt;Sun Sep 27&lt;/td&gt;&lt;td&gt;&lt;strong&gt;NFL GAME: Ravens vs. Cowboys at Maracanã, 5:25 PM.&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Relaxed morning only. Use a driver and leave 2½-3 hours before kickoff.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Mon Sep 28&lt;/td&gt;&lt;td&gt;Tijuca Forest short guided route; Little Africa/Pedra do Sal later.&lt;/td&gt;&lt;td&gt;Private vehicle and guide; shorten the trail if energy is low.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Tue Sep 29&lt;/td&gt;&lt;td&gt;Breakfast, last beach walk and departure for GIG.&lt;/td&gt;&lt;td&gt;Pre-arranged luggage handling and airport transfer.&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

  &lt;section aria-labelledby=&quot;rio-featured-experience-title&quot;&gt;
    &lt;h2 id=&quot;rio-featured-experience-title&quot;&gt;Featured Airbnb Experience: Christ by Train, Sugarloaf, Selarón &amp;amp; BBQ&lt;/h2&gt;
    &lt;div class=&quot;rio-featured-experience&quot;&gt;
      &lt;div&gt;&lt;strong&gt;What is included&lt;/strong&gt;&lt;p&gt;Hotel pickup, an expert guide, the scenic Corcovado train to Christ the Redeemer, Sugarloaf Mountain, Selarón Steps, a Maracanã sightseeing stop and a Brazilian barbecue lunch.&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;Duration, language and price&lt;/strong&gt;&lt;p&gt;8 hours with an English guide. Airbnb was shown from US$165 per guest (US$495 for three); Expedia recently showed about US$175 per adult including taxes and fees. Recheck the live total and cancellation deadline.&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;Why choose it&lt;/strong&gt;&lt;p&gt;It combines several major sights, transportation and lunch in one reservation—excellent for reducing planning and keeping the group moving.&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;Exact meeting point and tradeoff&lt;/strong&gt;&lt;p&gt;The selected option displays &lt;strong&gt;“Hotels in Copacabana”&lt;/strong&gt; as its Meeting/Redemption Point. Broader tour text mentions other hotel zones, but do not assume an Airbnb pickup. Plan to meet at the specific Copacabana hotel assigned in the booking confirmation unless the operator confirms another point in writing. From Airbnbs #1–3, use the private driver to Copacabana; #4–7 are the easiest bases; #8–10 may require a short transfer. This is a full, structured group day with less downtime and no guaranteed Sugarloaf sunset.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;viz-row&quot;&gt;&lt;a class=&quot;btn btn-primary&quot; href=&quot;https://www.airbnb.com/experiences/7133882?checkin=2026-09-24&amp;amp;checkout=2026-09-29&amp;amp;location=Rio%20de%20Janeiro%2C%20Brazil&amp;amp;currentTab=experience_tab&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Check dates on Airbnb&lt;/a&gt;&lt;a class=&quot;btn&quot; href=&quot;https://www.expedia.com/things-to-do/full-day-in-rio-christ-by-train-sugarloaf-city-tour-bbq.a564731.activity-details?location=Rio%20de%20Janeiro%2C%20Brazil&amp;amp;startDate=2026-09-24&amp;amp;endDate=2026-09-29&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Check dates on Expedia&lt;/a&gt;&lt;/div&gt;
    &lt;p class=&quot;text-small text-muted&quot;&gt;&lt;strong&gt;Best placement:&lt;/strong&gt; Friday, September 25. If booked, it replaces the separate Christ, Sugarloaf and Friday lunch arrangements; Selarón is an added stop. Keep Monday for Little Africa and Pedra do Sal. Send the operator the selected lodging address and request the exact hotel name, street address, pickup time and return point.&lt;/p&gt;
  &lt;/section&gt;
  &lt;hr&gt;
  &lt;section aria-labelledby=&quot;rio-cultural-booking-title&quot;&gt;
    &lt;h2 id=&quot;rio-cultural-booking-title&quot;&gt;Cultural experiences — exactly where and how to book&lt;/h2&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm rio-cultural-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Experience&lt;/th&gt;&lt;th&gt;Why it is worth doing&lt;/th&gt;&lt;th&gt;Best fit in this trip&lt;/th&gt;&lt;th&gt;How to book / transportation&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Private Santa Teresa + Selarón tour&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;A flexible, guided look at Rio’s bohemian hill neighborhood, street art, historic tram and viewpoints. The private format allows rest, photography and timing adjustments.&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Friday alternative&lt;/strong&gt; to the eight-hour group tour, or Saturday late morning instead of Tijuca.&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;https://www.rioculturalsecrets.com/tour-santa-teresa-rio-de-janeiro/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Book Rio Cultural Secrets directly&lt;/a&gt;. Its 4–5 hour private tour starts around US$250 per group of up to four, with vehicle and pickup; tickets and food are extra. Enter Sep 25 or 26, three guests and the Airbnb address.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Selarón Steps independently&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;More than 2,000 tiles cover this internationally recognized public artwork connecting Lapa and Santa Teresa.&lt;/td&gt;&lt;td&gt;Already included in the Friday all-in-one tour. Otherwise pair it with Santa Teresa in daylight.&lt;/td&gt;&lt;td&gt;No separate attraction ticket is required. Use the private driver or book a guided option through &lt;a href=&quot;https://www.viator.com/Rio-de-Janeiro-attractions/Selaron-Steps-Escadaria-Selaron/d712-a13341&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Viator&lt;/a&gt; or &lt;a href=&quot;https://www.getyourguide.com/en-gb/escadaria-selaron-l5213/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;GetYourGuide&lt;/a&gt;. Avoid treating a Google search card as a booking confirmation.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Salgueiro samba-school rehearsal&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;A much deeper Carnival experience than an ordinary club: bateria percussion, dancers, singers and a guided explanation of samba-school traditions.&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Saturday Sep 26 evening&lt;/strong&gt;, replacing the private lesson/live-club plan. Keep Saturday daytime light because return is around 1:00 AM.&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;https://www.getyourguide.com/rio-de-janeiro-l9/rio-salgueiro-samba-school-rehearsal-admission-w-transfer-t425301/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Check GetYourGuide availability&lt;/a&gt; or &lt;a href=&quot;https://www.headout.com/dance-shows-worldwide/rio-de-janeiro-salgueiro-samba-school-carnival-rehearsal-experience-e-51023/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;check Headout&lt;/a&gt;. GetYourGuide recently showed about US$78 per person, a five-hour experience, pickup around 8–9 PM, ticket, guide, shared table and transport. Santa Teresa guests meet at Vila Galé Hotel in Centro; the exact time arrives on the tour day.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Bar do Mineiro&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;A relaxed Santa Teresa institution for feijoada, pastéis and cachaça—good for experiencing neighborhood food rather than another formal tourist restaurant.&lt;/td&gt;&lt;td&gt;Lunch after a Santa Teresa tour. Reserve before the weekend rather than building the day around a long walk-in wait.&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;https://www.getin.app/rio-de-janeiro/bar-do-mineiro&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Reserve or join the digital queue in Get In&lt;/a&gt;. Address: Rua Paschoal Carlos Magno, 99, Santa Teresa. Have the chauffeur drop and return at an agreed time.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Private guide + translator&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Best when the group wants a custom pace, English-language help and a vehicle without joining a bus tour.&lt;/td&gt;&lt;td&gt;Use for a four-hour cultural or photography block on Friday or Monday; remember many museums close Monday.&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;https://gowithguide.com/brazil/tour/rio-de-janeiro-private-tour-guide-and-translator-services-8216&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Message and reserve through GoWithGuide&lt;/a&gt;. The listing recently showed US$150 per group, four-hour minimum, up to four guests, sedan included, with meals and admission extra.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;The Maze Rio — conditional only&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Architectural mosaics and a history of jazz events make it interesting, but current public access and programming are not reliable enough to schedule without direct confirmation.&lt;/td&gt;&lt;td&gt;Optional only. Do not displace a confirmed reservation for it.&lt;/td&gt;&lt;td&gt;Check &lt;a href=&quot;https://www.instagram.com/themaze_rio/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Maze’s current social updates&lt;/a&gt; and ask the concierge to confirm the event, hours, access arrangements and round-trip transport. Do not rely on old Wednesday–Sunday hours or historic monthly-jazz schedules.&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;p class=&quot;text-small text-muted&quot;&gt;&lt;strong&gt;Best cultural combination:&lt;/strong&gt; for maximum immersion, choose the private Santa Teresa/Selarón tour plus Bar do Mineiro, then the Saturday Salgueiro rehearsal. If the eight-hour Christ/Sugarloaf/Selarón tour is booked, skip a second Selarón tour and use the private guide for Little Africa instead.&lt;/p&gt;
  &lt;/section&gt;

  &lt;section aria-labelledby=&quot;rio-vip-title&quot;&gt;
    &lt;h2 id=&quot;rio-vip-title&quot;&gt;Bookable support services — price and link&lt;/h2&gt;
    &lt;p&gt;These are practical add-ons, not upgrades. A published price is shown only where the provider publishes one. All quote-only items need one written, all-in quote before payment.&lt;/p&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Service&lt;/th&gt;&lt;th&gt;Cost for this group&lt;/th&gt;&lt;th&gt;Book / request&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Dedicated bilingual driver + airport reception&lt;/strong&gt;&lt;br&gt;GIG meet-and-greet, flight monitoring, luggage help, airport transfers, touring and Maracanã drop/pickup plan.&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Written quote required.&lt;/strong&gt; The vendor does not publish a reliable full-trip rate; divide the final vehicle quote by 3.&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;https://riotransporteexecutivo.com.br/en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Request Rio Transporte Executivo quote&lt;/a&gt; — its site lists bilingual drivers, GIG reception, 24-hour service and armored-fleet options. Compare with &lt;a href=&quot;https://rioairporttransfer.com/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Rio Airport Transfer&lt;/a&gt; for English-speaking meet-and-greet service.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Stocked arrival + restaurant reservations&lt;/strong&gt;&lt;br&gt;Groceries placed at the property before arrival; restaurant bookings through the host/concierge.&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Quote only.&lt;/strong&gt; Grocery receipt + delivery/service fee; restaurant cost is the restaurant’s bill and any stated deposit.&lt;/td&gt;&lt;td&gt;Message the selected &lt;a href=&quot;https://www.airbnb.com/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Airbnb host&lt;/a&gt; before booking. Confirm outside-vendor access and request itemized groceries, delivery and reservation terms in writing.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Private chef breakfast or dinner&lt;/strong&gt;&lt;br&gt;Menu, groceries, service and clean-up.&lt;/td&gt;&lt;td&gt;&lt;strong&gt;R$198 per person for 3–6 guests&lt;/strong&gt; published by Take a Chef (about R$594 for three, before any change in exchange rate / menu).&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;https://www.takeachef.com/en-br/private-chef/rio-de-janeiro&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Get chef proposals from Take a Chef&lt;/a&gt;. Enter the exact Airbnb, date, three guests, allergies and kitchen details.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Private guide + photographer&lt;/strong&gt;&lt;br&gt;Christ, Sugarloaf and Little Africa at a flexible pace.&lt;/td&gt;&lt;td&gt;Guide: &lt;strong&gt;from US$150 per group / 4 hours&lt;/strong&gt; on the listed GoWithGuide service. Photographer: &lt;strong&gt;quote required&lt;/strong&gt; because time, delivery and rights vary.&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;https://gowithguide.com/brazil/tour/rio-de-janeiro-private-tour-guide-and-translator-services-8216&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Request the guide / translator&lt;/a&gt; and &lt;a href=&quot;https://www.flytographer.com/destinations/rio-de-janeiro/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;request a photographer quote&lt;/a&gt;. Verify host approval and ask for guide registration, photo delivery and usage terms.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;game-row&quot;&gt;&lt;td&gt;&lt;strong&gt;Ravens vs. Cowboys tickets or hospitality&lt;/strong&gt;&lt;br&gt;Sun Sep 27, 5:25 PM, Maracanã.&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Live checkout price only.&lt;/strong&gt; Ticket and hospitality inventory changes; no resale estimate is treated as a budget price.&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;https://www.ticketmaster.com.br/event/nfl-rio-game-2026-baltimore-ravens-vs-dallas-cowboys&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Official Ticketmaster Brazil listing&lt;/a&gt; · &lt;a href=&quot;https://onlocationexp.com/nfl/nfl-brazil-tickets&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Official On Location hospitality&lt;/a&gt;. Buy only through these official channels.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Private samba lesson + night out&lt;/strong&gt;&lt;br&gt;English-language lesson and flexible live-music plan.&lt;/td&gt;&lt;td&gt;&lt;strong&gt;R$150&lt;/strong&gt; published for a one-hour private class; &lt;strong&gt;R$250&lt;/strong&gt; published for a four-hour samba lesson + night event. Confirm whether the listed price is per person or private booking, plus table minimum and transport.&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;https://www.sambaclassrio.com/book-online&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Book / message Samba Class Rio&lt;/a&gt;.&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

  &lt;hr&gt;
  &lt;section aria-labelledby=&quot;rio-book-vip-title&quot;&gt;
    &lt;h2 id=&quot;rio-book-vip-title&quot;&gt;How to book the full VIP service plan&lt;/h2&gt;
    &lt;div class=&quot;rio-book-grid&quot;&gt;
      &lt;article&gt;&lt;h3&gt;1. Reserve the Airbnb&lt;/h3&gt;&lt;p&gt;Open a listing, confirm Sep 24–29 and the correct number of guests, read every house rule and pay only through Airbnb. Before choosing a nonrefundable rate, ask in Airbnb Messages whether a chef, instructor, photographer and concierge may enter the property.&lt;/p&gt;&lt;/article&gt;
      &lt;article&gt;&lt;h3&gt;2. Ask the host for one coordinated quote&lt;/h3&gt;&lt;p&gt;Request airport stocking, chef meals, reservations, guide/photographer and samba arrangements. Option 4, Rio001, specifically advertises 24/7 concierge support. For every other stay, ask what the host can arrange and what outside-vendor rules apply.&lt;/p&gt;&lt;/article&gt;
      &lt;article&gt;&lt;h3&gt;3. Book the bilingual chauffeur&lt;/h3&gt;&lt;p&gt;Send the full Sep 24–29 schedule to an executive-transport company. Require GIG flight monitoring, a name sign, luggage help, a vehicle sized for three people plus bags, daily standby hours, parking/tolls, overtime, English-speaking service, and the driver name/plate before arrival.&lt;/p&gt;&lt;/article&gt;
      &lt;article&gt;&lt;h3&gt;4. Lock the game-day plan&lt;/h3&gt;&lt;p&gt;Ask for a written Maracanã drop boundary, a fixed postgame meeting point away from the crowd, and a backup contact. The driver should follow official Sep 27 closures; do not promise curbside stadium pickup.&lt;/p&gt;&lt;/article&gt;
      &lt;article&gt;&lt;h3&gt;5. Confirm each specialist&lt;/h3&gt;&lt;p&gt;Chef: menu, groceries, allergies, service and cleanup. Guide/photographer: Cadastur registration, timed-ticket handling, photo delivery and usage rights. Samba: private lesson language/location, venue table, minimum spend, cancellation and return driver.&lt;/p&gt;&lt;/article&gt;
      &lt;article&gt;&lt;h3&gt;6. Reconfirm 48 hours before travel&lt;/h3&gt;&lt;p&gt;Collect the chauffeur’s name/plate, airport meeting point, property access instructions, vendor names, meal menu, attraction tickets, restaurant confirmations and emergency contacts in one group message.&lt;/p&gt;&lt;/article&gt;
    &lt;/div&gt;
    &lt;h3&gt;Good starting points&lt;/h3&gt;
    &lt;div class=&quot;rio-sources&quot;&gt;
      &lt;a href=&quot;https://www.aurumexecutive.com.br/en/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Aurum Executive — bilingual chauffeur, meet-and-greet, armored-car option&lt;/a&gt;
      &lt;a href=&quot;https://riotransporteexecutivo.com.br/en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Rio Transporte Executivo — bilingual driver, GIG reception, full-day service&lt;/a&gt;
      &lt;a href=&quot;https://www.cadastur.turismo.gov.br/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cadastur — verify tourism guides and transport providers&lt;/a&gt;
      &lt;a href=&quot;https://www.sambaclassrio.com/book-online&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Samba Class Rio — English private lesson and dance-night options&lt;/a&gt;
    &lt;/div&gt;
    &lt;h3&gt;Copy this request&lt;/h3&gt;
    &lt;div class=&quot;rio-request&quot;&gt;&lt;strong&gt;Rio VIP service request · Sep 24–29, 2026 · 3 travelers&lt;/strong&gt;&lt;br&gt;We need one bilingual point of contact and a written quote for: GIG meet-and-greet for AA905 on Sep 24, luggage assistance, stocked arrival, a dedicated chauffeur/vehicle through Sep 29, Maracanã transport for the Ravens–Cowboys game on Sep 27, private chef breakfast or dinner, restaurant reservations, a private registered guide and photographer for Christ/Sugarloaf/Little Africa, and a private samba lesson with a reserved live-music table. Please itemize vehicle, staffing, tickets, groceries, parking/tolls, waiting/overtime, cancellation terms and payment schedule. Confirm property-vendor access, daily standby hours, emergency contact, and when the driver name/plate will be supplied.&lt;/div&gt;
    &lt;p class=&quot;text-small text-muted&quot;&gt;“Security-aware” here means a vetted executive operator, discreet routing, flight/event monitoring and a dependable pickup plan. If the group needs close protection rather than an armored vehicle and chauffeur, request a separately licensed security provider and verify credentials before paying.&lt;/p&gt;
  &lt;/section&gt;
  &lt;hr&gt;
  &lt;section aria-labelledby=&quot;rio-notes-title&quot;&gt;
    &lt;h2 id=&quot;rio-notes-title&quot;&gt;Booking notes and sources&lt;/h2&gt;
    &lt;p&gt;Confirm exact property address, taxes, security deposit, cancellation rules, sleeping layout, minimum stay and September 24–29 availability before paying. Rental pins are neighborhood approximations because Airbnb hides exact addresses. Keep property messages, booking and payment on Airbnb.&lt;/p&gt;

  #rio-stay-map { color:var(--foreground); width:100%; }

  #rio-stay-map .rio-trip-dates { margin:0 0 10px; }
  #rio-stay-map .viz-controls { margin-bottom:10px; }

  #rio-selected { margin:8px 0 12px; padding:12px; }
  #rio-selected strong { font-weight:500; }
  #rio-stay-map .rio-water-note { margin:8px 0 4px; padding:10px 12px; background:color-mix(in srgb,var(--blue) 12%,var(--background)); border-left:4px solid var(--blue); }
  #rio-stay-map .rio-game-alert { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 12px; padding:12px; background:color-mix(in srgb,var(--red) 14%,var(--card)); color:var(--foreground); border-left:5px solid var(--red); }

  #rio-stay-map .rio-culture-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 18px; }
  #rio-stay-map .rio-culture-grid article { padding:10px 0; border-top:1px solid var(--border); }
  #rio-stay-map .rio-culture-grid h3,#rio-stay-map .rio-culture-grid p { margin:0 0 5px; }
  #rio-stay-map .rio-first-day { margin-top:8px; padding:12px; border-left:5px solid var(--viz-series-2); background:var(--card); }

  #rio-stay-map .rio-phone-safety ul { margin:8px 0; padding-left:22px; }
  #rio-stay-map .rio-phone-safety li { margin-bottom:6px; }
  #rio-stay-map .rio-flight-plan { margin:18px 0 22px; }

  #rio-stay-map .rio-shared-flight strong { white-space:nowrap; }
  #rio-stay-map .rio-budget { margin:18px 0 22px; padding:16px; border:2px solid var(--viz-series-1); }
  #rio-stay-map .rio-budget-callout { margin:10px 0 14px; padding:12px; background:color-mix(in srgb,var(--viz-series-1) 12%,var(--background)); border-left:5px solid var(--viz-series-1); }
  #rio-stay-map .rio-budget-table { min-width:900px; }
  #rio-stay-map .rio-budget-total-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:12px 0; }
  #rio-stay-map .rio-budget-total-grid article { padding:14px; background:var(--primary); color:var(--primary-foreground); }
  #rio-stay-map .rio-budget-total-grid span,#rio-stay-map .rio-budget-total-grid small { display:block; }
  #rio-stay-map .rio-budget-total-grid strong { display:block; margin:4px 0; font-size:1.35rem; }
  #rio-map-svg { display:block; width:100%; height:auto; min-height:540px; overflow:hidden; }
  #rio-map-svg .water { fill:color-mix(in srgb,var(--blue) 16%,var(--background)); }
  #rio-map-svg .land { fill:color-mix(in srgb,var(--green) 12%,var(--background)); stroke:none; }

  function showPlanContext(plan){
    if(!plan)return;
    let context=root.querySelector(&quot;#rio-plan-context&quot;);
    if(!context){context=document.createElement(&quot;div&quot;);context.id=&quot;rio-plan-context&quot;;context.style.cssText=&quot;margin:12px 0;padding:12px;border-left:5px solid var(--viz-series-2);background:var(--card);&quot;;root.prepend(context);}
    const outbound={wed:&quot;Arrive Thu Sep 24&quot;,thu:&quot;Arrive Fri Sep 25&quot;,fri:&quot;Arrive Sat Sep 26&quot;}[plan.departure]||&quot;Arrival not selected&quot;;
    const returning=plan.returnDay===&quot;mon&quot;?&quot;Leave Rio Mon Sep 28 · Monday is airport / packing only&quot;:&quot;Leave Rio Tue Sep 29 · Monday remains open for Little Africa or recovery&quot;;
    const labels={beach:&quot;Ipanema / beach day&quot;,shopping:&quot;Mall shopping&quot;,game:&quot;Maracanã game&quot;,forest:&quot;Tijuca Forest&quot;,africa:&quot;Little Africa&quot;};
    const chosen=(plan.activities||[]).map(id=&gt;labels[id]||attractions.find(a=&gt;a.id===id)?.name).filter(Boolean).join(&quot; · &quot;)||&quot;All activities shown&quot;;
    context.innerHTML=&quot;&lt;strong&gt;Your selected trip&lt;/strong&gt;&lt;br&gt;&quot;+outbound+&quot; · &quot;+returning+&quot;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;Chosen experiences: &quot;+chosen+&quot;. The highlighted stay and its distances below match this plan.&lt;/span&gt;&quot;;
  }
  window.addEventListener(&quot;message&quot;,(event)=&gt;{const stayId=event.data?.rioStay;if(stays.some(s=&gt;s.id===stayId)){select.value=stayId;selected=stays.find(s=&gt;s.id===stayId);updateDetails();draw();root.scrollIntoView({behavior:&quot;smooth&quot;,block:&quot;start&quot;});}showPlanContext(event.data?.rioPlan);});
  new ResizeObserver(draw).observe(root);
  updateDetails();draw();
})();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;
